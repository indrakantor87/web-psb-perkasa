<!DOCTYPE html>
<html>
<head>
    <title>PSB Perkasa</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            background: #0f172a;
            color: white;
            padding: 16px;
        }
        .card {
            width: 100%;
            max-width: 420px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            padding: 18px;
        }
        .muted {
            opacity: 0.75;
            font-size: 0.9em;
        }
        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 16px;
            margin-top: 20px;
            cursor: pointer;
        }
        button:active {
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1 style="margin: 0 0 6px 0;">PSB Perkasa Mobile</h1>
        <div class="muted">Aplikasi tidak dapat menghubungi server.</div>
        <div style="margin-top: 10px;" class="muted">Pastikan internet aktif.</div>
        <button onclick="window.location.reload()">Muat Ulang</button>
    </div>
</body>
</html>
