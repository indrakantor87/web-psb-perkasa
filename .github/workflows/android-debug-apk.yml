name: Android Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Capacitor sync
        run: npx cap sync android

      - name: Generate Android launcher icons from public/logo.png
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          if command -v magick >/dev/null 2>&1; then IM=magick; else IM=convert; fi
          generate_icon () {
            local size=$1
            local dir=$2
            local inset_pct=78
            local inner=$(( size * inset_pct / 100 ))
            local out1="android/app/src/main/res/${dir}/ic_launcher.png"
            local out2="android/app/src/main/res/${dir}/ic_launcher_round.png"
            local out3="android/app/src/main/res/${dir}/ic_launcher_foreground.png"
            mkdir -p "android/app/src/main/res/${dir}"
            $IM "public/logo.png" -resize "${inner}x${inner}" -gravity center -background none -extent "${size}x${size}" "$out1"
            $IM "public/logo.png" -resize "${inner}x${inner}" -gravity center -background none -extent "${size}x${size}" "$out2"
            $IM "public/logo.png" -resize "${inner}x${inner}" -gravity center -background none -extent "${size}x${size}" "$out3"
          }
          generate_icon 48 mipmap-mdpi
          generate_icon 72 mipmap-hdpi
          generate_icon 96 mipmap-xhdpi
          generate_icon 144 mipmap-xxhdpi
          generate_icon 192 mipmap-xxxhdpi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
